<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CourseWise</title>
    <meta
      name="description"
      content="A course information assistant that answers from versioned course documents and shows the source behind every claim."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="app">
      <!-- ------------------------------------------------------ Sidebar -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar__head">
          <div class="brand">
            <span class="brand__mark">C</span>
            <span>CourseWise</span>
          </div>
          <button
            type="button"
            class="icon-btn sidebar__collapse"
            id="sidebar-toggle"
            aria-label="Collapse sidebar"
          >
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="m15 18-6-6 6-6" />
            </svg>
          </button>
        </div>

        <button type="button" class="new-chat" id="new-chat">
          <span class="new-chat__plus">+</span>
          <span>New chat</span>
        </button>

        <div class="sidebar__section">
          <div class="sidebar__label">Recent</div>
          <div class="conv-list" id="conversation-list"></div>
        </div>

        <div class="sidebar__foot">
          <span class="pill" id="health-pill">
            <span class="dot"></span>
            <span id="health-text">Connecting…</span>
          </span>
        </div>
      </aside>

      <!-- --------------------------------------------------------- Main -->
      <main class="main">
        <header class="topbar">
          <button
            type="button"
            class="icon-btn topbar__menu"
            id="sidebar-open"
            aria-label="Open sidebar"
          >
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M3 6h18M3 12h18M3 18h18" />
            </svg>
          </button>
          <span class="topbar__title" id="topbar-title">CourseWise</span>
          <span class="topbar__spacer"></span>
          <button
            type="button"
            class="icon-btn topbar__clear"
            id="clear-chat"
            aria-label="Clear this conversation"
            title="Clear conversation"
          >
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6" />
            </svg>
          </button>
        </header>

        <div class="conversation" id="conversation">
          <div class="welcome" id="welcome">
            <h1>CourseWise</h1>
            <p>
              Ask about deadlines, policies, readings or the exam format.
              Answers come from the course documents and carry their source.
            </p>
          </div>
        </div>

        <div class="composer-wrap">
          <div class="composer">
            <textarea
              id="composer-input"
              class="composer__input"
              rows="1"
              placeholder="Ask about the course…"
              aria-label="Your question"
            ></textarea>
            <button
              type="button"
              class="composer__send"
              id="composer-send"
              aria-label="Send"
            >
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="m22 2-7 20-4-9-9-4Z" />
                <path d="M22 2 11 13" />
              </svg>
            </button>
          </div>
        </div>
      </main>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
